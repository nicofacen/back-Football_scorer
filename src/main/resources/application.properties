spring.application.name=e-commerce

# H2 Database (se reinicia al parar la app)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (turno Nicolas) - secreto de desarrollo. En un proyecto real iria en variable de entorno.
jwt.secret=f3a7c1e9b5d24f80a6c3e7b1d9f45a82c6e0b3d7f1a4c8e2b6d0f3a7c1e9b5d2
jwt.expiration-ms=86400000

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always